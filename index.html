<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JioBlackRock Partner Privé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #000632;
      --gold: #cea15a;
      --gold-light: #e2c06b;
      --gold-line: rgba(201,168,76,0.35);
      --gold-dim: rgba(201,168,76,0.08);
      --white: #f5f0e8;
      --white-dim: rgba(245,240,232,0.6);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Figtree', Helvetica, sans-serif;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 32px;
      border-bottom: 1px solid var(--gold-line);
    }
    .nav-logo-img {
      height: 52px;
      width: auto;
      object-fit: contain;
      filter: brightness(0.9) contrast(1.1);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      position: relative;
    }
    main::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(600px, 90vw);
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(201,168,76,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--gold-line);
      border-radius: 12px;
      padding: clamp(40px, 8vw, 72px) clamp(28px, 6vw, 64px);
      text-align: center;
      max-width: 560px;
      width: 100%;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.8s ease 0.2s both;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px;
      width: 18px; height: 18px;
      border-top: 1px solid var(--gold);
      border-left: 1px solid var(--gold);
    }
    .card::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 18px; height: 18px;
      border-bottom: 1px solid var(--gold);
      border-right: 1px solid var(--gold);
    }
    .icon-wrap {
      width: 64px;
      height: 64px;
      border: 1px solid var(--gold-line);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      background: var(--gold-dim);
    }
    .icon-wrap svg {
      width: 26px;
      height: 26px;
      stroke: var(--gold);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .eyebrow {
      font-size: 16px;
      letter-spacing: 0.4em;
      color: var(--gold);
      margin-bottom: 18px;
    }
    .title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 300;
      line-height: 1.1;
      color: var(--white);
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 auto 22px;
      width: 220px;
    }
    .divider span { flex: 1; height: 1px; }
    .divider span:first-child { background: linear-gradient(to right, transparent, var(--gold-line)); }
    .divider span:last-child  { background: linear-gradient(to left,  transparent, var(--gold-line)); }
    .divider i {
      width: 5px; height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
      display: inline-block;
      flex-shrink: 0;
    }
    .message {
      font-size: clamp(14px, 3.5vw, 16px);
      font-weight: 300;
      color: var(--white-dim);
      line-height: 1.8;
      max-width: 380px;
      margin: 0 auto 28px;
    }
    .event-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border: 1px solid var(--gold-line);
      border-radius: 999px;
      font-size: 12px;
      color: var(--white-dim);
      letter-spacing: 0.08em;
    }
    .event-pill span.dot {
      width: 5px; height: 5px;
      background: var(--gold);
      border-radius: 50%;
      flex-shrink: 0;
    }
    footer {
      border-top: 1px solid rgba(201,168,76,0.1);
      padding: 28px 24px;
      text-align: center;
    }
    .footer-logo {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--gold);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    .footer-meta {
      font-size: 11px;
      color: rgba(245,240,232,0.3);
      letter-spacing: 0.12em;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 480px) {
      nav { padding: 18px 20px; }
      .nav-logo-img { height: 42px; }
      .card { border-radius: 10px; }
    }
  </style>
</head>
<body>
 
  <nav>
    <img src="jioblackrocklogo.png" alt="JioBlackRock" class="nav-logo-img" />
  </nav>
 
  <main>
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8"  y1="2" x2="8"  y2="6"/>
          <line x1="3"  y1="10" x2="21" y2="10"/>
          <line x1="9"  y1="15" x2="15" y2="15"/>
        </svg>
      </div>
 
      <p class="eyebrow">JioBlackRock Partner Privé</p>
 
      <h1 class="title">Registrations<br>are Closed</h1>
 
      <div class="divider"><span></span><i></i><span></span></div>
 
      <p class="message">
        Thank you for your interest. Registrations for this exclusive event have now closed.
      </p>
 
      <div class="event-pill">
        <span class="dot"></span>
        7 May 2026 &nbsp;·&nbsp; The Lalit, New Delhi
      </div>
    </div>
  </main>
 
  <footer>
    <p class="footer-logo">JioBlackRock Partner Privé</p>
    <p class="footer-meta">in partnership with SIF360 &nbsp;·&nbsp; 7 May 2026 &nbsp;·&nbsp; The Lalit, New Delhi</p>
  </footer>
 
</body>
</html>
